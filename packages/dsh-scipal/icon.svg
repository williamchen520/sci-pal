<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SciPal Literature Tools">
  <defs>
    <linearGradient id="spBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板：深蓝到青，取 SciPal 主色 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#spBg)"/>

  <!-- 文献页（右上角折角） -->
  <path d="M16 14h20l10 10v24a3 3 0 0 1-3 3H16a3 3 0 0 1-3-3V17a3 3 0 0 1 3-3z" fill="#ffffff" opacity="0.96"/>
  <path d="M36 14l10 10H36z" fill="#bfdbfe"/>

  <!-- 正文行：由长到短，暗示结构化段落 -->
  <rect x="19" y="30" width="21" height="2.8" rx="1.4" fill="#1e3a8a"/>
  <rect x="19" y="35.5" width="17" height="2.8" rx="1.4" fill="#1e3a8a" opacity="0.72"/>
  <rect x="19" y="41" width="12" height="2.8" rx="1.4" fill="#1e3a8a" opacity="0.48"/>

  <!-- 检索放大镜：琥珀色，指向文献 -->
  <circle cx="43" cy="43" r="7.2" fill="none" stroke="#fbbf24" stroke-width="3.2"/>
  <line x1="48.2" y1="48.2" x2="54" y2="54" stroke="#fbbf24" stroke-width="3.6" stroke-linecap="round"/>
</svg>
