services:
  app:
    image: scipal-app:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      SCIPAL_AUTH_REQUIRED: "1"
      SCIPAL_HOST: "0.0.0.0"
      SCIPAL_EMBEDDING_MODEL: "/models/models/BAAI--bge-base-en-v1.5"
      SCIPAL_RERANK_MODEL: "/models/models/BAAI--bge-reranker-base"
    volumes:
      - ../data:/app/data
      - ../documents:/app/documents
      - ../documents_xml:/app/documents_xml
      - ../logs:/app/logs
      - ../models:/models:ro
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  watch-cron:
    image: scipal-app:latest
    command: ["python", "scripts/run_watch_due.py", "--loop", "--interval", "300"]
    env_file:
      - .env
    environment:
      SCIPAL_AUTH_REQUIRED: "1"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  health-cron:
    image: scipal-app:latest
    command:
      - sh
      - -c
      - "while true; do python scripts/dual_write_healthcheck.py; sleep 300; done"
    env_file:
      - .env
    environment:
      SCIPAL_AUTH_REQUIRED: "1"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
