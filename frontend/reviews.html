<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Pal - 历史综述</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f0;
            color: #1a1b1c;
            line-height: 1.6;
            padding: 20px;
        }
        header { text-align: center; margin-bottom: 24px; }
        header h1 { font-size: 24px; margin-bottom: 8px; }
        header a { color: #4f6b9a; text-decoration: none; font-size: 14px; margin: 0 6px; }
        .layout { display: flex; gap: 20px; max-width: 1280px; margin: 0 auto; align-items: flex-start; }
        .list { width: 340px; flex-shrink: 0; }
        .card {
            background: #fff; border: 1px solid #e4e3dd; border-radius: 12px;
            padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
        }
        .card:hover { border-color: #4f6b9a; }
        .card.active { border-color: #4f6b9a; box-shadow: 0 0 0 2px rgba(79,107,154,.12); }
        .card-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .card-meta { font-size: 12px; color: #6b7280; }
        .detail {
            flex: 1; background: #fff; border: 1px solid #e4e3dd; border-radius: 12px;
            padding: 24px 28px; min-height: 420px;
        }
        .detail h2 { font-size: 20px; margin-bottom: 6px; }
        .detail .meta { font-size: 12px; color: #6b7280; margin-bottom: 18px; }
        .markdown h1 { font-size: 20px; margin: 18px 0 10px; }
        .markdown h2 { font-size: 17px; margin: 18px 0 10px; }
        .markdown h3 { font-size: 15px; margin: 14px 0 8px; }
        .markdown p { margin-bottom: 10px; white-space: pre-wrap; }
        .markdown li { margin-left: 22px; margin-bottom: 4px; }
        .empty { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .error { color: #991b1b; }
        .refs { margin-top: 22px; border-top: 1px solid #e4e3dd; padding-top: 14px; }
        .refs h3 { font-size: 15px; margin-bottom: 8px; }
        .refs li { font-size: 13px; margin-left: 20px; margin-bottom: 4px; color: #374151; }
        .guard-badge { display: inline-block; font-size: 12px; color: #374151; background: #eef2f7;
            border: 1px solid #dbe3ee; border-radius: 8px; padding: 4px 10px; margin-bottom: 14px; }
        .actions { margin-bottom: 14px; font-size: 12px; display: flex; gap: 10px; align-items: center; }
        .actions button { padding: 6px 12px; border: 1px solid #dbe3ee; background: #fff; border-radius: 8px; cursor: pointer; font-size: 12px; color: #374151; }
        .actions button:hover { border-color: #4f6b9a; color: #4f6b9a; }
        .actions a { color: #4f6b9a; }
    </style>
</head>
<body>
<header>
    <h1>📚 历史综述</h1>
    <a href="/">← 返回搜索</a> · <a href="/review.html">📝 生成综述</a> · <a href="/references.html">📚 文献库</a> · <a href="/tasks.html">📋 任务列表</a>
</header>

<div class="layout">
    <aside class="list" id="reviewList">
        <div class="empty">加载中...</div>
    </aside>
    <section class="detail" id="reviewDetail">
        <div class="empty">从左侧选择一篇综述</div>
    </section>
</div>

<script src="/src/reviews.js"></script>
</body>
</html>
