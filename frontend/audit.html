<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SciPal · 裁决审计</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b1020; color: #e2e8f0; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 18px 28px; border-bottom: 1px solid #1e3a5f; }
    header .brand { color: #f5c542; font-size: 22px; font-weight: 800; }
    header a { color: #7dd3fc; text-decoration: none; font-size: 13px; }
    main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }
    h2 { font-size: 18px; margin: 26px 0 10px; }
    .hint { color: #64748b; font-size: 12px; line-height: 1.7; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; background: #131c31; border: 1px solid #1e3a5f; border-radius: 10px; overflow: hidden; font-size: 13px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #1e3a5f; vertical-align: top; }
    th { color: #94a3b8; font-weight: 600; background: #0f1a2e; }
    td a { color: #7dd3fc; text-decoration: none; }
    .empty { color: #64748b; padding: 22px 0; text-align: center; }
    #error { color: #f87171; font-size: 13px; min-height: 20px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">裁决审计</span>
    <a href="/">← 返回工作台</a>
    <a href="/evidence.html">证据裁决</a>
    <a href="/plans.html">RAG 计划</a>
  </header>
  <main>
    <div class="hint">
      这里只读展示人类裁决与冲突标记；机器不能生成裁决。导出包包含证据、裁决、冲突和 RO-Crate metadata。
    </div>
    <div id="error" role="alert"></div>
    <h2>人工裁决 <a href="/api/rag/audit/adjudications.csv" style="font-size:12px;color:#7dd3fc">下载 CSV</a></h2>
    <div id="adjudications"></div>
    <h2>冲突标记 <a href="/api/rag/audit/conflicts.csv" style="font-size:12px;color:#7dd3fc">下载 CSV</a></h2>
    <div id="conflicts"></div>
  </main>
  <script src="/src/audit.js"></script>
</body>
</html>
