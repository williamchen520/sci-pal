name: pr-template

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const required = [
              "## 0. 协作规则自检",
              "## 1. 背景描述",
              "## 2. 核心改动",
              "## 3. 基准测试指标变化",
            ];
            const missing = required.filter((heading) => !body.includes(heading));
            if (missing.length) {
              core.setFailed(
                "PR 正文缺少必需章节：\n" +
                  missing.join("\n") +
                  "\n请使用 .github/pull_request_template.md，并先读 .dsh_rules。"
              );
            }
            const ruleChecks = [
              ["单一主题", "规则 1：单一主题"],
              ["准备好让人类合并", "规则 2：人类合并确认"],
              ["Claim 状态", "规则 3：Claim 状态与证据链"],
              ["下一轮", "规则 5：本轮完成与下一轮"],
            ];
            const missingRules = ruleChecks.filter(([needle]) => !body.includes(needle));
            if (missingRules.length) {
              core.setFailed(
                "第 0 节协作规则自检未填完整：\n" +
                  missingRules.map(([, label]) => label).join("\n")
              );
            }
            if (!/\|\s*指标\s*\|/.test(body) || !/Recall@10|MRR|nDCG/.test(body)) {
              core.setFailed(
                "第 3 节必须包含基准测试 Markdown 表（指标 / 基线 / 变更后 / 变化）。"
              );
            }
