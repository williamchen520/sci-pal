<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Pal - 实验方案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f0; color: #1a1b1c; line-height: 1.6; padding: 20px; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 22px; margin-bottom: 6px; }
  header a { color: #4f6b9a; text-decoration: none; font-size: 13px; margin: 0 6px; }
  .layout { display: flex; gap: 18px; max-width: 1200px; margin: 0 auto; align-items: flex-start; }
  .list { width: 320px; flex-shrink: 0; }
  .import-bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .import-bar input { flex: 1; padding: 8px 10px; border: 1px solid #e4e3dd; border-radius: 8px; font-size: 13px; }
  .import-bar button { padding: 8px 12px; border: none; border-radius: 8px; background: #4f6b9a; color: #fff; cursor: pointer; }
  .card { background: #fff; border: 1px solid #e4e3dd; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
  .card:hover { border-color: #4f6b9a; }
  .card-title { font-size: 14px; font-weight: 600; }
  .card-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .detail { flex: 1; background: #fff; border: 1px solid #e4e3dd; border-radius: 12px; padding: 22px 26px; min-height: 360px; }
  .detail h2 { font-size: 19px; margin-bottom: 4px; }
  .detail .meta { font-size: 12px; color: #6b7280; margin-bottom: 16px; }
  .step { border-left: 3px solid #4f6b9a; padding-left: 12px; margin-bottom: 16px; }
  .step h3 { font-size: 14px; }
  .step p { font-size: 13px; color: #374151; margin: 4px 0; }
  .tag { display: inline-block; font-size: 11px; background: #eef2f7; border-radius: 6px; padding: 1px 6px; margin-right: 6px; color: #4b5563; }
  .empty { text-align: center; padding: 50px 20px; color: #9ca3af; }
  .error { color: #991b1b; font-size: 12px; }
  .hint { font-size: 11px; color: #9ca3af; margin: 0 0 8px 2px; }
  .hint.ok { color: #166534; }
  .hint.bad { color: #991b1b; }
  #protocolSearch { width: 100%; padding: 7px 10px; border: 1px solid #e4e3dd; border-radius: 8px; font-size: 13px; margin-bottom: 10px; }
  .load-more { width: 100%; padding: 8px; border: 1px dashed #cbd5e1; background: #fff; border-radius: 8px; color: #4f6b9a; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: 0.55; cursor: default; }
  .step a, .detail a { color: #4f6b9a; }
</style>
</head>
<body>
<header>
  <h1>🧪 实验方案</h1>
  <a href="/">← 返回搜索</a> · <a href="/reviews.html">📚 历史综述</a> · <a href="/review.html">📝 综述生成</a> · <a href="/references.html">📚 文献库</a>
</header>
<div class="layout">
  <aside class="list">
    <div class="import-bar">
      <input id="importId" placeholder="粘贴 protocols.io 链接或 ID">
      <button id="importBtn" onclick="importProtocol()">导入</button>
    </div>
    <div class="hint">支持 https://www.protocols.io/view/…-123456 或数字 ID</div>
    <div id="importStatus" class="hint"></div>
    <input id="protocolSearch" placeholder="搜索标题 / DOI" oninput="onSearch()">
    <div id="protocolList"><div class="empty">加载中...</div></div>
    <div id="loadMoreWrap" style="display:none"><button id="loadMoreBtn" class="load-more" onclick="loadMore()">加载更多</button></div>
  </aside>
  <section class="detail" id="protocolDetail"><div class="empty">从左侧选择协议</div></section>
</div>
<script src="/src/protocols.js"></script>
</body>
</html>
