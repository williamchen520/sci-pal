name: tests

on:
  workflow_dispatch:
  pull_request:

jobs:
  tests:
    # Needs a self-hosted runner with SciPal dependencies.
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SQL guard
        run: python scripts/sql_guard.py --changed --forbid-schema public --allow-destructive
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

