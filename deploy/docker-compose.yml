services:
  app:
    image: scipal-app:latest
    gpus: all
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      APP_MODE: "${APP_MODE:-DEV_MODE}"
      SCIPAL_AUTH_REQUIRED: "1"
      SCIPAL_HOST: "0.0.0.0"
      SCIPAL_EMBEDDING_MODEL: "/models/models/BAAI--bge-base-en-v1.5"
      SCIPAL_RERANK_MODEL: "/models/models/BAAI--bge-reranker-base"
    volumes:
      - ../data:/app/data
      - F:/scipal_data/documents:/app/documents
      - F:/scipal_data/documents_xml:/app/documents_xml
      - ../logs:/app/logs
      - ../models:/models:ro
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  watch-cron:
    image: scipal-app:latest
    entrypoint: []
    command: ["python", "scripts/run_watch_due.py", "--loop", "--interval", "300"]
    env_file:
      - .env
    environment:
      SCIPAL_AUTH_REQUIRED: "1"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  pg-backup:
    image: postgres:16
    entrypoint: ["/bin/bash", "/pg_backup.sh"]
    env_file:
      - .env
    volumes:
      - ../backups:/app/backups
      - ./pg_backup.sh:/pg_backup.sh:ro
    healthcheck:
      disable: true
    restart: unless-stopped

  paradedb:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_DB: scipal_g0
      POSTGRES_PASSWORD: scipal_g0
    ports:
      - "5434:5432"
    volumes:
      - paradedb_g0:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scipal_g0"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  paradedb_g0:
    external: true
    name: paradedb_g0
  caddy_data:
  caddy_config:
