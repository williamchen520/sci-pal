<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Pal PDF Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'PingFang SC','Segoe UI',Roboto,sans-serif; background: #525659; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .toolbar { background: #323639; padding: 8px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1e1e1e; flex-shrink: 0; }
  .toolbar .title { font-size: 13px; color: #ccc; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar button { background: #4a4d50; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: background .15s; }
  .toolbar button:hover { background: #5c6063; }
  .toolbar button:disabled { opacity: .4; cursor: not-allowed; }
  .toolbar .page-info { font-size: 13px; color: #aaa; min-width: 70px; text-align: center; }
  .toolbar input[type="number"] { width: 50px; padding: 4px 6px; border: 1px solid #555; border-radius: 4px; background: #4a4d50; color: #fff; font-size: 13px; text-align: center; }
  .viewer-container { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 20px; }
  .pdf-page { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); margin-bottom: 20px; }
  .pdf-page canvas { display: block; max-width: 100%; height: auto; }
  .loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; font-size: 14px; }
  .zoom-controls { display: flex; align-items: center; gap: 4px; }
  .zoom-controls span { font-size: 12px; color: #aaa; min-width: 42px; text-align: center; }
</style>
</head>
<body>
<div class="toolbar">
  <button id="prevBtn" onclick="prevPage()">◀ 上一页</button>
  <input type="number" id="pageInput" min="1" value="1" onchange="goToPage(this.value)">
  <span class="page-info" id="pageInfo">1 / 1</span>
  <button id="nextBtn" onclick="nextPage()">下一页 ▶</button>
  <div class="zoom-controls">
    <button onclick="zoomOut()">−</button>
    <span id="zoomLabel">100%</span>
    <button onclick="zoomIn()">+</button>
  </div>
  <div class="title" id="docTitle">Loading...</div>
</div>
<div class="viewer-container" id="viewer">
  <div class="loading">⏳ Loading PDF...</div>
</div>

<script src="/vendor/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdf.worker.min.js';

let pdfDoc = null;
let currentPage = 1;
let scale = 1.2;
const viewer = document.getElementById('viewer');
const pageInfo = document.getElementById('pageInfo');
const pageInput = document.getElementById('pageInput');
const docTitle = document.getElementById('docTitle');
const zoomLabel = document.getElementById('zoomLabel');

// Parse query params
const params = new URLSearchParams(window.location.search);
const fileUrl = params.get('file') || '';
const startPage = parseInt(params.get('page')) || 1;
const title = params.get('title') || '';

if (title) docTitle.textContent = title;

if (!fileUrl) {
  viewer.innerHTML = '<div class="loading">❌ No PDF file specified. Use ?file=/api/papers/&lt;id&gt;/pdf</div>';
} else {
  loadPdf(fileUrl);
}

async function loadPdf(url) {
  try {
    const loadingTask = pdfjsLib.getDocument(url);
    pdfDoc = await loadingTask.promise;
    const total = pdfDoc.numPages;
    pageInfo.textContent = `1 / ${total}`;
    pageInput.max = total;
    docTitle.textContent = title || `${total} pages`;
    currentPage = Math.min(startPage, total);
    pageInput.value = currentPage;
    renderPage(currentPage);
  } catch (e) {
    viewer.innerHTML = `<div class="loading">❌ Failed to load PDF: ${e.message}</div>`;
  }
}

async function renderPage(num) {
  if (!pdfDoc) return;
  try {
    const page = await pdfDoc.getPage(num);
    const viewport = page.getViewport({ scale: scale });
    viewer.innerHTML = '';
    const pageDiv = document.createElement('div');
    pageDiv.className = 'pdf-page';
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    pageDiv.appendChild(canvas);
    viewer.appendChild(pageDiv);
    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    pageInfo.textContent = `${num} / ${pdfDoc.numPages}`;
    pageInput.value = num;
    document.getElementById('prevBtn').disabled = num <= 1;
    document.getElementById('nextBtn').disabled = num >= pdfDoc.numPages;
  } catch (e) {
    viewer.innerHTML = `<div class="loading">❌ Render error: ${e.message}</div>`;
  }
}

function prevPage() { if (currentPage > 1) { currentPage--; renderPage(currentPage); } }
function nextPage() { if (pdfDoc && currentPage < pdfDoc.numPages) { currentPage++; renderPage(currentPage); } }
function goToPage(n) { n = parseInt(n); if (pdfDoc && n >= 1 && n <= pdfDoc.numPages) { currentPage = n; renderPage(n); } }
function zoomIn() { scale = Math.min(scale * 1.2, 4); zoomLabel.textContent = Math.round(scale * 100 / 1.2) + '%'; renderPage(currentPage); }
function zoomOut() { scale = Math.max(scale / 1.2, 0.5); zoomLabel.textContent = Math.round(scale * 100 / 1.2) + '%'; renderPage(currentPage); }

// Keyboard navigation
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevPage();
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextPage();
});
</script>
</body>
</html>
