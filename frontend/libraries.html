<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SciPal · 我的代码库</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b1020; color: #e2e8f0; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
    header { padding: 18px 24px; border-bottom: 1px solid #1e293b; display: flex; gap: 16px; align-items: baseline; }
    header h1 { margin: 0; font-size: 22px; color: #f5c542; }
    header a { color: #38bdf8; text-decoration: none; }
    main { max-width: 1180px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 300px 1fr; gap: 18px; }
    .card { background: #111a2e; border: 1px solid #1e3a5f; border-radius: 12px; padding: 16px; }
    h2 { font-size: 15px; margin: 0 0 12px; color: #93c5fd; }
    label { display: block; font-size: 12px; color: #94a3b8; margin: 10px 0 4px; }
    input, select { width: 100%; padding: 8px 10px; border-radius: 7px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
    button { margin-top: 10px; padding: 8px 12px; border-radius: 7px; border: 1px solid #2563eb; background: #1d4ed8; color: #fff; cursor: pointer; }
    button.secondary { background: #0f172a; border-color: #475569; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .library { padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
    .library:hover { background: #16213a; }
    .library.active { border-color: #38bdf8; background: #16213a; }
    .muted { color: #94a3b8; font-size: 12px; }
    .status { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; }
    .status span { color: #cbd5e1; }
    .hit { border-top: 1px solid #1e293b; padding: 10px 0; }
    .hit strong { color: #7dd3fc; }
    .hit pre { margin: 6px 0; padding: 8px; background: #0b1220; border-radius: 6px; white-space: pre-wrap; color: #cbd5e1; font-size: 12px; }
    #message { color: #fca5a5; min-height: 20px; }
    #trace { font-size: 12px; white-space: pre-wrap; color: #cbd5e1; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>我的代码库</h1>
    <a href="/">← 返回工作台</a>
    <span class="muted">独立 scipal_code · 按 library 隔离</span>
  </header>
  <main>
    <section class="card">
      <h2>代码库</h2>
      <div id="libraries"></div>
      <h2 style="margin-top:18px">新建代码库</h2>
      <label for="name">名称</label>
      <input id="name" placeholder="scanpy">
      <label for="repo_url">仓库 URL</label>
      <input id="repo_url" placeholder="https://github.com/...">
      <label for="ref">ref（可选）</label>
      <input id="ref" placeholder="1.12.5">
      <button id="create">注册代码库</button>
      <p class="muted">注册后仍需索引 worker 写入 unit；当前 UI 不自动 clone。</p>
    </section>

    <section class="card">
      <h2>检索</h2>
      <div id="current" class="muted">未选择库</div>
      <div class="status" id="status"></div>
      <div class="row">
        <input id="query" placeholder="例如 normalize total counts">
        <button id="search">搜索</button>
      </div>
      <p id="message"></p>
      <div id="hits"></div>
      <h2 style="margin-top:18px">调用图</h2>
      <div id="trace" class="muted">选择结果的“Trace”查看 1–2 跳。</div>
    </section>
  </main>
  <script src="/src/libraries.js"></script>
</body>
</html>
