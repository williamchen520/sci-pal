<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Pal - 任务列表</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f0;
            color: #1a1b1c;
            line-height: 1.6;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 24px; margin-bottom: 8px; }
        header a { color: #4f6b9a; text-decoration: none; font-size: 14px; }
        .filters {
            display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
            align-items: center;
        }
        .filters select, .filters button {
            padding: 8px 14px; border: 1px solid #e4e3dd; border-radius: 8px;
            background: #fff; font-size: 13px; cursor: pointer;
        }
        .filters button { background: #4f6b9a; color: #fff; border: none; }
        .task-card {
            background: #fff; border-radius: 12px; padding: 16px 20px;
            margin-bottom: 12px; border: 1px solid #e4e3dd;
        }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .task-type { font-weight: 600; font-size: 14px; }
        .status { padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
        .status-running { background: #dbeafe; color: #1e40af; }
        .status-completed { background: #dcfce7; color: #166534; }
        .status-failed { background: #fef2f2; color: #991b1b; }
        .status-cancelled { background: #f3f4f6; color: #6b7280; }
        .task-progress { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
        .task-time { font-size: 12px; color: #9ca3af; }
        .task-error { font-size: 12px; color: #991b1b; margin-top: 6px; }
        .empty { text-align: center; padding: 60px 20px; color: #9ca3af; }
        .progress-bar {
            width: 100%; height: 6px; background: #e5e7eb; border-radius: 3px;
            overflow: hidden; margin-top: 8px;
        }
        .progress-fill {
            height: 100%; background: #4f6b9a; border-radius: 3px;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>📋 任务列表</h1>
        <a href="/">← 返回搜索</a>
    </header>

    <div class="filters">
        <select id="filterType">
            <option value="">全部类型</option>
            <option value="download">下载</option>
            <option value="review_outline">综述大纲</option>
            <option value="review_generate">综述生成</option>
        </select>
        <select id="filterStatus">
            <option value="">全部状态</option>
            <option value="running">运行中</option>
            <option value="completed">已完成</option>
            <option value="failed">失败</option>
            <option value="cancelled">已取消</option>
        </select>
        <button onclick="loadTasks()">刷新</button>
    </div>

    <div id="taskList">
        <div class="empty">加载中...</div>
    </div>
</div>

<script>
async function loadTasks() {
    const type = document.getElementById('filterType').value;
    const status = document.getElementById('filterStatus').value;
    let url = '/api/tasks?limit=50';
    if (type) url += '&type=' + type;
    if (status) url += '&status=' + status;

    try {
        const resp = await fetch(url);
        const data = await resp.json();
        renderTasks(data.tasks || []);
    } catch (e) {
        document.getElementById('taskList').innerHTML = '<div class="empty">加载失败: ' + e.message + '</div>';
    }
}

function renderTasks(tasks) {
    const container = document.getElementById('taskList');
    if (tasks.length === 0) {
        container.innerHTML = '<div class="empty">暂无任务记录</div>';
        return;
    }

    container.innerHTML = tasks.map(t => {
        const statusClass = 'status-' + t.status;
        const progressPct = t.progress_pct || 0;
        const created = t.created_at ? new Date(t.created_at).toLocaleString('zh-CN') : '';
        let html = '<div class="task-card">';
        html += '<div class="task-header">';
        html += '<span class="task-type">' + esc(t.type) + '</span>';
        html += '<span class="status ' + statusClass + '">' + esc(t.status) + '</span>';
        html += '</div>';
        if (t.progress_text) {
            html += '<div class="task-progress">' + esc(t.progress_text) + '</div>';
            if (t.status === 'running') {
                html += '<div class="progress-bar"><div class="progress-fill" style="width:' + progressPct + '%"></div></div>';
            }
        }
        if (t.error) {
            html += '<div class="task-error">⚠️ ' + esc(t.error) + '</div>';
        }
        html += '<div class="task-time">' + created + '</div>';
        html += '</div>';
        return html;
    }).join('');
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

document.getElementById('filterType').onchange = loadTasks;
document.getElementById('filterStatus').onchange = loadTasks;
loadTasks();
setInterval(loadTasks, 5000);
</script>
</body>
</html>
