<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Pal - 文献库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f0; color: #1a1b1c; line-height: 1.6; padding: 20px; }
  header { text-align: center; margin-bottom: 18px; }
  header h1 { font-size: 22px; margin-bottom: 6px; }
  header a { color: #4f6b9a; text-decoration: none; font-size: 13px; margin: 0 6px; }
  .panel { max-width: 1000px; margin: 0 auto 14px; background: #fff; border: 1px solid #e4e3dd; border-radius: 12px; padding: 16px 18px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row input[type=file] { font-size: 13px; }
  .row textarea { width: 100%; min-height: 90px; padding: 8px 10px; border: 1px solid #e4e3dd; border-radius: 8px; font-size: 12px; font-family: Consolas, monospace; }
  button { padding: 7px 14px; border: none; border-radius: 8px; background: #4f6b9a; color: #fff; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: 0.55; cursor: default; }
  .hint { font-size: 12px; color: #9ca3af; }
  .hint.ok { color: #166534; } .hint.bad { color: #991b1b; }
  .list { max-width: 1000px; margin: 0 auto; background: #fff; border: 1px solid #e4e3dd; border-radius: 12px; overflow: hidden; }
  .list-head { padding: 12px 18px; border-bottom: 1px solid #eee; font-size: 13px; color: #6b7280; }
  .item { padding: 12px 18px; border-bottom: 1px solid #f1f1ee; }
  .item:last-child { border-bottom: none; }
  .item-title { font-size: 14px; font-weight: 600; }
  .item-meta { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .empty { padding: 40px; text-align: center; color: #9ca3af; }
</style>
</head>
<body>
<header>
  <h1>📚 文献库</h1>
  <a href="/">← 返回搜索</a> · <a href="/reviews.html">历史综述</a> · <a href="/protocols.html">实验方案</a> · <a href="/review.html">综述生成</a>
</header>
<div class="panel">
  <div class="row" style="margin-bottom:10px">
    <input type="file" id="risFile" accept=".ris,.enw,.xml,.txt">
    <button id="uploadBtn" onclick="importFile()">导入文件</button>
    <span class="hint">支持 RIS / EndNote XML / ENW</span>
  </div>
  <textarea id="pasteBox" placeholder="或直接粘贴 RIS 文本（TY  - JOUR …）"></textarea>
  <div class="row" style="margin-top:8px">
    <button id="pasteBtn" onclick="importText()">导入粘贴内容</button>
    <span id="status" class="hint"></span>
  </div>
</div>
<div class="list">
  <div class="list-head" id="listHead">加载中...</div>
  <div id="items"></div>
</div>
<script src="/src/references.js"></script>
</body>
</html>
