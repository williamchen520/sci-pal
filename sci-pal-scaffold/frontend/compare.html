<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Pal — 双栏论文对比</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'PingFang SC','Segoe UI',Roboto,sans-serif; background: #f4f3ee; color: #1a1b1c; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { background: #fff; padding: 10px 20px; border-bottom: 1px solid #e4e3dd; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  header h1 { font-size: 16px; color: #4f6b9a; }
  header .back { font-size: 13px; color: #6b7280; text-decoration: none; cursor: pointer; }
  header .back:hover { color: #4f6b9a; }
  .sync-toggle { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6b7280; cursor: pointer; }
  .sync-toggle input { cursor: pointer; }
  .panes { flex: 1; display: flex; gap: 4px; padding: 4px; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; background: #fff; border: 1px solid #e4e3dd; border-radius: 8px; overflow: hidden; min-width: 0; }
  .pane-header { padding: 8px 12px; border-bottom: 1px solid #e4e3dd; display: flex; align-items: center; gap: 8px; background: #fafaf8; flex-shrink: 0; }
  .pane-header label { font-size: 12px; color: #6b7280; font-weight: 600; }
  .pane-header select { flex: 1; padding: 5px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; background: #fff; max-width: 100%; }
  .pane-header .open-btn { padding: 4px 10px; background: #4f6b9a; color: #fff; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .pane-header .open-btn:hover { opacity: .88; }
  .pane-body { flex: 1; position: relative; min-height: 0; }
  .pane-body iframe { width: 100%; height: 100%; border: none; display: block; }
  .pane-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #9ca3af; font-size: 14px; flex-direction: column; gap: 8px; }
  .pane-placeholder .icon { font-size: 36px; opacity: .4; }
  .divider { width: 4px; background: #e4e3dd; cursor: col-resize; flex-shrink: 0; }
</style>
</head>
<body>
<header>
  <a class="back" href="/">← 返回搜索</a>
  <h1>📖 双栏论文对比</h1>
  <label class="sync-toggle">
    <input type="checkbox" id="syncScroll" onchange="toggleSync()">
    同步翻页
  </label>
</header>
<div class="panes">
  <div class="pane" id="leftPane">
    <div class="pane-header">
      <label>左</label>
      <select id="leftSelect" onchange="loadPaper('left')">
        <option value="">— 选择论文 —</option>
      </select>
      <button class="open-btn" onclick="openInNewTab('left')">↗ 新窗口</button>
    </div>
    <div class="pane-body" id="leftBody">
      <div class="pane-placeholder"><div class="icon">📄</div>选择左侧论文</div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="pane" id="rightPane">
    <div class="pane-header">
      <label>右</label>
      <select id="rightSelect" onchange="loadPaper('right')">
        <option value="">— 选择论文 —</option>
      </select>
      <button class="open-btn" onclick="openInNewTab('right')">↗ 新窗口</button>
    </div>
    <div class="pane-body" id="rightBody">
      <div class="pane-placeholder"><div class="icon">📄</div>选择右侧论文</div>
    </div>
  </div>
</div>

<script>
let papers = [];
let syncEnabled = false;

// Load paper list
async function loadPapers() {
  try {
    const resp = await fetch('/api/papers');
    const data = await resp.json();
    papers = data.papers || [];
    papers.sort((a, b) => (b.year || 0) - (a.year || 0));
    const options = papers.map(p =>
      `<option value="${p.paper_id}">${(p.year || '?')} · ${(p.title || 'Untitled').substring(0, 70)}</option>`
    ).join('');
    document.getElementById('leftSelect').innerHTML = '<option value="">— 选择论文 —</option>' + options;
    document.getElementById('rightSelect').innerHTML = '<option value="">— 选择论文 —</option>' + options;

    // Auto-select from URL params if present
    const params = new URLSearchParams(window.location.search);
    const leftId = params.get('left');
    const rightId = params.get('right');
    if (leftId) { document.getElementById('leftSelect').value = leftId; loadPaper('left'); }
    if (rightId) { document.getElementById('rightSelect').value = rightId; loadPaper('right'); }
  } catch (e) {
    console.error('Failed to load papers:', e);
  }
}

function loadPaper(side) {
  const select = document.getElementById(side + 'Select');
  const body = document.getElementById(side + 'Body');
  const paperId = select.value;
  if (!paperId) {
    body.innerHTML = `<div class="pane-placeholder"><div class="icon">📄</div>选择${side === 'left' ? '左' : '右'}侧论文</div>`;
    return;
  }
  const paper = papers.find(p => p.paper_id === paperId);
  const title = paper ? encodeURIComponent(paper.title || '') : '';
  const pdfUrl = `/api/papers/${paperId}/pdf`;
  body.innerHTML = `<iframe src="/viewer.html?file=${encodeURIComponent(pdfUrl)}&page=1&title=${title}" id="${side}Frame"></iframe>`;

  // Update URL
  const leftId = document.getElementById('leftSelect').value;
  const rightId = document.getElementById('rightSelect').value;
  const url = new URL(window.location);
  if (leftId) url.searchParams.set('left', leftId); else url.searchParams.delete('left');
  if (rightId) url.searchParams.set('right', rightId); else url.searchParams.delete('right');
  window.history.replaceState({}, '', url);
}

function openInNewTab(side) {
  const select = document.getElementById(side + 'Select');
  if (!select.value) return;
  const paper = papers.find(p => p.paper_id === select.value);
  const title = paper ? encodeURIComponent(paper.title || '') : '';
  window.open(`/viewer.html?file=/api/papers/${select.value}/pdf&page=1&title=${title}`, '_blank');
}

function toggleSync() {
  syncEnabled = document.getElementById('syncScroll').checked;
  if (syncEnabled) {
    // Sync: when left page changes, change right too
    const leftFrame = document.getElementById('leftFrame');
    const rightFrame = document.getElementById('rightFrame');
    if (leftFrame && rightFrame) {
      // We can't easily access iframe content due to same-origin (it IS same origin actually)
      // But the viewer uses canvas rendering, so we'd need to postMessage
      // For now, sync means: both navigate to same page number
      console.log('Sync scroll enabled (basic: same page number)');
    }
  }
}

// Init
loadPapers();
</script>
</body>
</html>
