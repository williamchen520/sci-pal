<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SciPal · 登录</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b1020; color: #e2e8f0;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(420px, calc(100vw - 32px)); padding: 36px 32px;
      background: #131c31; border: 1px solid #1e3a5f; border-radius: 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 6px; font-size: 26px; color: #f5c542; }
    p { margin: 0 0 24px; color: #94a3b8; font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 13px; color: #cbd5e1; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 9px;
      border: 1px solid #27405f; background: #0f1a2e; color: #e2e8f0;
      font-size: 15px; outline: none;
    }
    input:focus { border-color: #38bdf8; }
    button {
      width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 9px;
      background: #f5c542; color: #111827; font-weight: 700; font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .error { min-height: 20px; margin-top: 12px; color: #f87171; font-size: 13px; }
    .hint { margin-top: 18px; color: #64748b; font-size: 12px; line-height: 1.6; }
    code { color: #7dd3fc; }
  </style>
</head>
<body>
  <main class="card">
    <h1>SciPal</h1>
    <p>登录到课题组工作区</p>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">登录</button>
      <div class="error" id="error" role="alert"></div>
    </form>
    <div class="hint">
      首次部署请先在服务器运行 <code>python scripts/create_admin.py &lt;username&gt;</code>。
    </div>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("error");
    const submit = document.getElementById("submit");

    async function currentSession() {
      try {
        const response = await fetch("/api/auth/me", { credentials: "same-origin" });
        return response.ok;
      } catch {
        return false;
      }
    }

    currentSession().then((loggedIn) => {
      if (loggedIn) window.location.replace("/");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";
      submit.disabled = true;
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(body.error || "登录失败");
        }
        window.location.replace("/");
      } catch (error) {
        errorBox.textContent = error.message || "登录失败";
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
