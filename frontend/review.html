<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sci-Pal 综述生成与预览</title>
<link rel="stylesheet" href="/src/review.css">
</head>
<body>

<!-- 顶部工具栏 -->
<div class="toolbar">
  <span class="logo">🔬 Sci-Pal</span>
  <span class="topic" id="topicDisplay">综述生成</span>
  <div class="stats" id="statsDisplay"></div>
  <button onclick="location.href='/'">← 返回搜索</button>
</div>

<!-- V25.9: 大纲编辑器（默认显示，有 review_id 时隐藏） -->
<div class="outline-editor" id="outlineEditor">

  <!-- 编辑器顶部控制栏 -->
  <div class="editor-controls">
    <div class="control-group">
      <label for="editorTopicInput">综述主题</label>
      <input type="text" id="editorTopicInput" placeholder="例如：STAT1 signaling in immune diseases">
    </div>
    <div class="control-group">
      <label for="editorReviewType">综述类型</label>
      <select id="editorReviewType">
        <option value="narrative">叙事型 Narrative</option>
        <option value="comparative">对比型 Comparative</option>
        <option value="systematic">系统综述型 Systematic</option>
      </select>
    </div>
    <div class="control-group">
      <label for="editorMaxPapers">最大论文数</label>
      <input type="number" id="editorMaxPapers" value="20" min="5" max="50" style="width:70px;">
    </div>
    <button id="searchAndAssignBtn" class="btn-secondary" title="按大纲内容搜索文献，然后自动分配给各章节和段落">🔍 按大纲搜索并分配</button>
    <button id="assignPapersBtn" class="btn-secondary" style="display:none;" title="自动计算论文与各章节的相似度，发配到相关章节">📌 确定大纲，自动发配</button>
    <button id="confirmAssignBtn" class="btn-secondary" style="display:none;" title="确认文献和章节的对应关系">✅ 最终确定</button>
    <button id="swapLayoutBtn" class="btn-secondary" title="互换大纲栏与PDF栏位置">↔ 互换布局</button>
    <button id="importPaperBtn" class="btn-secondary" title="导入文献（正文+补充材料）">📥 导入文献</button>
  </div>

  <!-- 消息提示 -->
  <div class="editor-message" id="editorMessage" style="display:none;"></div>

  <!-- 编辑器主体：左大纲 + 中论文列表 + 右PDF阅读器（V25.10 三栏布局） -->
  <div class="editor-main">

    <!-- 左侧：大纲结构 -->
    <div class="editor-left">
      <div class="panel-header">
        <span>📋 大纲结构</span>
        <span class="outline-stats" id="outlineStats"></span>
        <div class="panel-actions">
          <button id="saveOutlineBtn" class="btn-small" title="保存当前大纲">💾 保存</button>
          <select id="templateSelect" class="select-small">
            <option value="">-- 📂 选择模板/加载 --</option>
            <optgroup label="📋 预设模板">
              <option value="template_systematic">系统综述型 Systematic</option>
              <option value="template_narrative">叙事型 Narrative</option>
              <option value="template_methodological">方法学型 Methodological</option>
            </optgroup>
            <optgroup label="💾 已保存大纲" id="savedOutlineGroup">
            </optgroup>
          </select>
        </div>
      </div>
      <div class="outline-content" id="outlineContent">
        <div class="outline-empty">
          <div class="icon">📝</div>
          <div>从上方"选择模板/加载"下拉菜单选择大纲模板<br>然后编辑标题、关键词，按大纲搜索文献并生成综述</div>
          <div class="hint">你可以：选择模板 · 编辑标题/关键词 · 增删章节段落 · 按大纲搜文献 · 保存/加载</div>
        </div>
      </div>
      <div class="editor-footer">
        <button id="generateReviewBtn" class="btn-primary btn-large" disabled>🚀 生成综述（英文）</button>
      </div>
    </div>

    <!-- V25.12: 拖拽调宽分隔条（左栏↔中栏） -->
    <div class="resizer" data-panel="left" title="拖动调整宽度"></div>

    <!-- 中间：论文列表（V25.11 增加本地文献库 tab） -->
    <div class="editor-center">
      <div class="panel-tabs">
        <button class="panel-tab active" data-tab="related">📚 相关论文</button>
        <button class="panel-tab" data-tab="local">📁 本地文献库</button>
        <button class="panel-tab" data-tab="abstracts">📝 摘要库</button>
      </div>
      <div class="paper-list" id="paperList">
        <div class="paper-empty">
          <div class="icon">📄</div>
          <div>生成大纲后，相关论文将显示在这里<br>点击论文在右侧打开 PDF</div>
        </div>
      </div>
    </div>

    <!-- V25.12: 拖拽调宽分隔条（中栏↔右栏） -->
    <div class="resizer" data-panel="center" title="拖动调整宽度"></div>

    <!-- 右侧：PDF 阅读器（V25.14 改为浏览器原生 iframe 渲染） -->
    <div class="editor-pdf">
      <div class="pdf-toolbar">
        <!-- V25.14: 移除翻页/缩放按钮，由浏览器自带 PDF 工具栏替代；保留分配到段落和标题 -->
        <select id="oeAssignParaSelect" class="oe-assign-select" onchange="oeAssignToParagraph(this.value)" title="将当前论文分配到选中的段落">
          <option value="">分配到段落…</option>
        </select>
        <span class="pdf-title" id="oePdfTitle"></span>
      </div>
      <div class="pdf-container" id="oePdfContainer">
        <div class="empty-state">
          <div class="icon">📖</div>
          <div>点击中间列表中的论文<br>在此处打开 PDF 阅读</div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 综述预览（有 review_id 时显示） -->
<div class="main-container" id="reviewContainer" style="display:none;">

  <!-- 左侧：综述内容 -->
  <div class="review-panel" id="reviewPanel">
    <div class="loading">
      <div class="spinner"></div>
      <div>加载中...</div>
    </div>
  </div>

  <!-- 右侧：PDF + 证据详情 -->
  <div class="pdf-panel">
    <!-- PDF 工具栏（V25.14: iframe 渲染，浏览器自带工具栏，只保留标题和分配） -->
    <div class="pdf-toolbar">
      <select id="oeAssignSelect" style="display:none;">
        <option value="">分配到段落...</option>
      </select>
      <span class="pdf-title" id="pdfTitle"></span>
    </div>

    <!-- PDF 容器 -->
    <div class="pdf-container" id="pdfContainer">
      <div class="empty-state">
        <div class="icon">📖</div>
        <div>点击中间列表中的论文<br>在此处打开 PDF 阅读</div>
      </div>
    </div>

    <!-- 证据详情面板 -->
    <div class="evidence-panel" id="evidencePanel">
      <div class="empty-state">
        <div class="icon">📄</div>
        <div>证据详情将显示在这里</div>
      </div>
    </div>
  </div>

<!-- V25.17: 补充材料管理面板（模态框） -->
<div id="supplementary-modal" class="supp-modal">
  <div class="supp-modal-content" id="supplementary-panel"></div>
</div>

<!-- V25.17: 文献导入对话框（模态框） -->
<div id="import-modal" class="import-modal">
  <div class="import-modal-content" id="import-panel"></div>
</div>

</div>

<!-- V25.14: 大纲编辑器模块化（按依赖顺序加载），PDF 改用浏览器原生 iframe 渲染，移除 PDF.js 和标注模块 -->
<script src="/src/pdf_viewer.js"></script>
<script src="/src/paper_list.js"></script>
<script src="/src/outline_core.js"></script>
<script src="/src/outline_editor.js"></script>
<!-- V25.12: 三栏拖拽调宽 -->
<script src="/src/resizer.js"></script>
<!-- V25.17: 补充材料管理 -->
<script src="/src/supplementary_manager.js"></script>
<!-- V25.17: 文献导入（正文+补充材料一次上传） -->
<script src="/src/paper_importer.js"></script>
<!-- 综述预览逻辑 -->
<script src="/src/review.js"></script>

</body>
</html>
